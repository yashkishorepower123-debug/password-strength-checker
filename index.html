<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Password Security Suite</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --primary: #38bdf8;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 14px 45px 14px 14px;
            background: #0f172a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-family: monospace;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 14px;
        }

        /* Meter Bar */
        .meter-container {
            height: 10px;
            background: #0f172a;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .meter-bar {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease, background-color 0.4s ease;
        }

        /* Metrics grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .metric-box {
            font-size: 13px;
        }

        .metric-label {
            color: var(--text-sub);
            display: block;
            margin-bottom: 4px;
        }

        .metric-value {
            font-weight: bold;
            font-size: 14px;
        }

        /* Generator Section */
        .generator-section {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
        }

        .gen-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .gen-controls label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .slider-container {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .copy-btn {
            background: #334155;
            color: #fff;
            margin-top: 8px;
        }

        .warnings {
            color: var(--danger);
            font-size: 13px;
            margin-bottom: 10px;
            list-style-type: none;
            padding-left: 0;
        }

        .warnings li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Password Security Suite</h2>

    <!-- Input Section -->
    <div class="input-group">
        <input type="password" id="password" placeholder="Type or generate a password..." oninput="evaluatePassword()">
        <button type="button" class="toggle-btn" onclick="toggleVisibility()">Show</button>
    </div>

    <div class="meter-container">
        <div id="meter-bar" class="meter-bar"></div>
    </div>

    <!-- Feedback Metrics -->
    <div class="metrics-grid">
        <div class="metric-box">
            <span class="metric-label">Strength Rating</span>
            <span id="strength-text" class="metric-value" style="color: var(--text-sub);">—</span>
        </div>
        <div class="metric-box">
            <span class="metric-label">Entropy Score</span>
            <span id="entropy-text" class="metric-value">0 bits</span>
        </div>
        <div class="metric-box" style="grid-column: span 2;">
            <span class="metric-label">Est. Time to Crack (Brute Force)</span>
            <span id="crack-time" class="metric-value" style="color: var(--primary);">0 seconds</span>
        </div>
    </div>

    <ul id="warnings-list" class="warnings"></ul>

    <!-- Password Generator Options -->
    <div class="generator-section">
        <div class="gen-controls">
            <div class="slider-container">
                <span>Length: <strong id="length-val">16</strong></span>
                <input type="range" id="gen-length" min="8" max="64" value="16" oninput="document.getElementById('length-val').innerText = this.value">
            </div>
            <label><input type="checkbox" id="inc-sym" checked> Special (!@#$)</label>
            <label><input type="checkbox" id="inc-num" checked> Numbers (0-9)</label>
            <label><input type="checkbox" id="inc-upper" checked> Uppercase (A-Z)</label>
            <label><input type="checkbox" id="inc-lower" checked> Lowercase (a-z)</label>
        </div>

        <button type="button" class="btn" onclick="generateAndSetPassword()">⚡ Generate Strong Password</button>
        <button type="button" class="btn copy-btn" onclick="copyPassword()">📋 Copy to Clipboard</button>
    </div>
</div>

<script>
    function toggleVisibility() {
        const input = document.getElementById('password');
        const btn = event.target;
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerText = 'Hide';
        } else {
            input.type = 'password';
            btn.innerText = 'Show';
        }
    }

    function evaluatePassword() {
        const pwd = document.getElementById('password').value;
        const meterBar = document.getElementById('meter-bar');
        const strengthText = document.getElementById('strength-text');
        const entropyText = document.getElementById('entropy-text');
        const crackTimeText = document.getElementById('crack-time');
        const warningsList = document.getElementById('warnings-list');

        warningsList.innerHTML = '';

        if (!pwd) {
            meterBar.style.width = '0%';
            strengthText.innerText = '—';
            strengthText.style.color = 'var(--text-sub)';
            entropyText.innerText = '0 bits';
            crackTimeText.innerText = '0 seconds';
            return;
        }

        // Calculate Character Pool Size
        let poolSize = 0;
        if (/[a-z]/.test(pwd)) poolSize += 26;
        if (/[A-Z]/.test(pwd)) poolSize += 26;
        if (/[0-9]/.test(pwd)) poolSize += 10;
        if (/[^a-zA-Z0-9]/.test(pwd)) poolSize += 32;

        // Base Shannon Entropy calculation: log2(poolSize^length)
        let entropy = pwd.length * (poolSize > 0 ? Math.log2(poolSize) : 0);

        // Pattern Penalties
        const warnings = [];
        
        // Penalty: Sequences
        if (/(abc|bcd|cde|def|efg|fgh|ghi|hij|ijk|jkl|klm|lmn|mno|nop|opq|pqr|qrs|rst|stu|tuv|uvw|vwx|wxy|xyz|012|123|234|345|456|567|678|789)/i.test(pwd)) {
            entropy -= 10;
            warnings.push("Contains easy sequential characters.");
        }
        
        // Penalty: Common Keyboard Walks
        if (/(qwerty|asdf|zxcv|password|admin|123456)/i.test(pwd)) {
            entropy -= 20;
            warnings.push("Contains weak patterns or common words.");
        }

        // Penalty: Repeated Characters
        if (/(.)\1{2,}/.test(pwd)) {
            entropy -= 10;
            warnings.push("Contains repeated identical characters.");
        }

        // Ensure floor at 0
        entropy = Math.max(0, Math.round(entropy));

        // Render Warnings
        warnings.forEach(warn => {
            const li = document.createElement('li');
            li.innerText = '⚠️ ' + warn;
            warningsList.appendChild(li);
        });

        // Calculate crack time based on 10 Billion guesses per second (Modern GPU cluster)
        const guessesPerSec = 1e10;
        const totalCombinations = Math.pow(2, entropy);
        const secondsToCrack = totalCombinations / guessesPerSec;

        entropyText.innerText = `${entropy} bits`;
        crackTimeText.innerText = formatTime(secondsToCrack);

        // Update Strength Meter UI
        if (entropy < 40) {
            meterBar.style.width = '25%';
            meterBar.style.backgroundColor = 'var(--danger)';
            strengthText.innerText = 'Very Weak';
            strengthText.style.color = 'var(--danger)';
        } else if (entropy < 60) {
            meterBar.style.width = '50%';
            meterBar.style.backgroundColor = 'var(--warning)';
            strengthText.innerText = 'Moderate';
            strengthText.style.color = 'var(--warning)';
        } else if (entropy < 80) {
            meterBar.style.width = '75%';
            meterBar.style.backgroundColor = '#3b82f6'; // Blue
            strengthText.innerText = 'Strong';
            strengthText.style.color = '#3b82f6';
        } else {
            meterBar.style.width = '100%';
            meterBar.style.backgroundColor = 'var(--success)';
            strengthText.innerText = 'Unbreakable';
            strengthText.style.color = 'var(--success)';
        }
    }

    function formatTime(seconds) {
        if (seconds < 1) return 'Instantly';
        if (seconds < 60) return `${Math.floor(seconds)} seconds`;
        if (seconds < 3600) return `${Math.floor(seconds / 60)} minutes`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)} hours`;
        if (seconds < 31536000) return `${Math.floor(seconds / 86400)} days`;
        if (seconds < 3153600000) return `${Math.floor(seconds / 31536000)} years`;
        return 'Centuries';
    }

    function generateAndSetPassword() {
        const length = parseInt(document.getElementById('gen-length').value);
        const incUpper = document.getElementById('inc-upper').checked;
        const incLower = document.getElementById('inc-lower').checked;
        const incNum = document.getElementById('inc-num').checked;
        const incSym = document.getElementById('inc-sym').checked;

        let charPool = '';
        if (incUpper) charPool += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        if (incLower) charPool += 'abcdefghijklmnopqrstuvwxyz';
        if (incNum) charPool += '0123456789';
        if (incSym) charPool += '!@#$%^&*()_+-=[]{}|;:,.<>?';

        if (!charPool) {
            alert('Please select at least one character set.');
            return;
        }

        // Cryptographically Secure Pseudo-Random Number Generator (CSPRNG)
        const array = new Uint32Array(length);
        window.crypto.getRandomValues(array);

        let generatedPassword = '';
        for (let i = 0; i < length; i++) {
            generatedPassword += charPool[array[i] % charPool.length];
        }

        const pwdInput = document.getElementById('password');
        pwdInput.value = generatedPassword;
        evaluatePassword();
    }

    function copyPassword() {
        const pwdInput = document.getElementById('password');
        if (!pwdInput.value) return;

        navigator.clipboard.writeText(pwdInput.value).then(() => {
            alert('Password copied to clipboard!');
        });
    }
</script>

</body>
</html>
